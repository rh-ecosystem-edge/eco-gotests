components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the client credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.example.com/realms/oran/protocol/openid-connect/token
          scopes:
            role:o2ims-reader: O2IMS Reader Role
            role:o2ims-subscriber: O2IMS Subscriber Role
            role:o2ims-maintainer: O2IMS Maintainer Role

  schemas:
    AlarmEventRecord:
      type: object
      properties:
        alarmEventRecordId:
          type: string
          format: uuid
          description: |
            Identifier of an entry in the AlarmEventRecord.
            Locally unique within the scope of an O-Cloud instance.
          example: 752c4e22-057d-4162-997b-ca3e2fd4ff53
        alarmDefinitionId:
          type: string
          format: uuid
          description: |
            A reference to the Alarm Definition record in the Alarm Dictionary associated with the referenced Resource Type.
          example: 5369fe06-adeb-4966-b8ff-47a6f4d4cec5
        probableCauseId:
          type: string
          format: uuid
          description: A reference to the ProbableCause of the Alarm.
          example: b45f64fe-6ed8-448d-8ff7-f5840090a075
        alarmRaisedTime:
          type: string
          format: date-time
          description: This field is populated with a Date/Time stamp value when the AlarmEventRecord is created.
          example: 2042-07-21T17:32:28Z
        alarmChangedTime:
          type: string
          format: date-time
          description: |
            This field is populated with a Date/Time stamp value when any value
            of the AlarmEventRecord is modified.
          example: 2042-07-21T19:32:28Z
        alarmClearedTime:
          type: string
          format: date-time
          description: |
            This field is populated with a Date/Time stamp value when the alarm condition is cleared.
          example: 2042-07-21T20:32:28Z
        alarmAcknowledgeTime:
          type: string
          format: date-time
          description: This field is populated with a Date/Time stamp value when the alarm condition is acknowledged.
          example: 2042-07-21T18:32:28Z
        alarmAcknowledged:
          type: boolean
          description: |
            When a system acknowledges an alarm, it is then set to TRUE.
          example: true
        objectTypeId:
          type: string
          format: uuid
          description: A reference to the type of resource which caused the alarm.
          example: 91d5d140-ef52-4167-b6dc-975ad1897f23
        objectId:
          type: string
          format: uuid
          description: A reference to the resource which caused the alarm.
          example: 91d5d140-ef52-4167-b6dc-975ad1897f23
        perceivedSeverity:
          $ref: '#/components/schemas/PerceivedSeverity'
        objectClass:
          type: string
          minLength: 1
          description: |
            The fully qualified name of the class of the object (Resource or NodeCluster) which caused the alarm.
            This is a mandatory, non-blank value.
          example: oran.o2ims.cluster.NodeCluster
        extensions:
          type: object
          additionalProperties: {}
          description: |
            These are unspecified (not standardized) properties (keys) which are tailored by the vendor or
            operator to extend the information provided about the O-Cloud Alarm.
      required:
      - alarmEventRecordId
      - alarmDefinitionId
      - probableCauseId
      - alarmRaisedTime
      - alarmAcknowledged
      - perceivedSeverity
      - extensions
      - objectTypeId
      - objectId
      - objectClass

    AlarmEventRecordModifications:
      type: object
      properties:
        alarmAcknowledged:
          type: boolean
          description: Acknowledge an alarm.
          example: false
        perceivedSeverity:
          $ref: '#/components/schemas/PerceivedSeverity'

    AlarmServiceConfiguration:
      type: object
      properties:
        retentionPeriod:
          type: integer
          description: |
            Number of days for alarm history to be retained.
            This value cannot be set lower than 1 (day).
          example: 30
        extensions:
          type: object
          additionalProperties: {}
          description: List of metadata key-value pairs used to associate meaningful metadata to the related alarm service
      required:
      - retentionPeriod

    AlarmServiceConfigurationPatch:
      type: object
      description: Schema for PATCH requests allowing partial updates to AlarmServiceConfiguration
      properties:
        retentionPeriod:
          type: integer
          description: |
            Number of days for alarm history to be retained.
            This value cannot be set lower than 1 (day).
          example: 30
        extensions:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            RFC 7396 merge-patch semantics: an object value merges entries into the
            stored extensions (null-valued keys remove entries); an explicit null
            clears all extensions; omission leaves the stored value unchanged.

    AlarmSubscriptionInfo:
      type: object
      additionalProperties: false
      properties:
        alarmSubscriptionId:
          type: string
          format: uuid
          readOnly: true
          description: Identifier for the Alarm Subscription. This identifier is allocated by the O-Cloud.
          example: 16d5fc54-cee0-4532-9826-2369f8240e1b
        consumerSubscriptionId:
          type: string
          description: Identifier for the consumer of events sent due to the Subscription.
          example: 16d5fc54-cee0-4532-9826-2369f8240e1b
        eventFilter:
          type: string
          enum: [ NEW, CHANGE, CLEAR, ACKNOWLEDGE ]
          nullable: true
          description: |
            Typed criteria for events which will be filtered by the subscription notification service.
            It carries exclusion semantics: an event whose notificationEventType equals eventFilter is
            not delivered. An omitted or null eventFilter excludes no event types, so all events are
            eligible for delivery (O-RAN spec cardinality M/0..1). Responses include this key only
            when a filter is set; an unset filter is represented by omitting the key.
          example: NEW
        callback:
          type: string
          format: uri
          description: The fully qualified URI to a consumer procedure which can process a Post of the AlarmEventNotification.
      required:
      - callback

    AlarmSubscriptionUpdate:
      type: object
      additionalProperties: false
      description: |
        Schema for RFC 7396 JSON Merge Patch requests to an Alarm Subscription.
        Every field is optional. An omitted field is left unchanged; an explicit
        null clears the field (callback cannot be cleared); a value replaces it.
      properties:
        callback:
          type: string
          format: uri
          nullable: true
          description: |
            The fully qualified URI to a consumer procedure which can process a Post
            of the AlarmEventNotification. A null value is rejected (callback cannot be cleared).
        eventFilter:
          type: string
          enum: [ NEW, CHANGE, CLEAR, ACKNOWLEDGE ]
          nullable: true
          description: |
            Typed criteria for events which will be filtered by the subscription notification service.
            Omitting this field leaves the current value unchanged. A null value clears the eventFilter,
            so no event types are excluded and all events are eligible for delivery. A value replaces it.
        consumerSubscriptionId:
          type: string
          nullable: true
          description: |
            Identifier for the consumer of events sent due to the Subscription.
            A null value clears the consumerSubscriptionId.

    ProbableCause:
      type: object
      properties:
        probableCauseId:
          type: string
          format: uuid
          description: Identifier of the ProbableCause.
          example: b45f64fe-6ed8-448d-8ff7-f5840090a075
        name:
          type: string
          description: Human readable text of the probable cause derived from corresponding AlarmDefinition.
          example: NodeClockNotSynchronising
        description:
          type: string
          description: Any additional information beyond the name to describe the probableCause derived from corresponding AlarmDefinition.
          example: Clock not synchronising.
      required:
      - probableCauseId
      - name
      - description

    PerceivedSeverity:
      type: integer
      description: This is an enumerated set of values which identify the perceived severity of the alarm.
      enum: [ 0, 1, 2, 3, 4, 5 ]
      x-enum-varnames:
      - CRITICAL
      - MAJOR
      - MINOR
      - WARNING
      - INDETERMINATE
      - CLEARED
      example: 1

    AlertmanagerNotificationStatus:
      type: string
      enum: [ resolved, firing ]
      description: Alertmanager notification status

    Alert:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AlertmanagerNotificationStatus'
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        generatorURL:
          type: string
          format: uri
          description: Identifies the entity that caused the alert
        fingerprint:
          type: string
          description: Fingerprint to identify the alert

    AlertmanagerNotification:
      type: object
      description: Alertmanager notification payload as described here https://prometheus.io/docs/alerting/latest/configuration/#webhook_config
      properties:
        version:
          type: string
        groupKey:
          type: string
          description: Key identifying the group of alerts (e.g. to deduplicate)
        truncatedAlerts:
          type: integer
          description: How many alerts have been truncated due to "max_alerts"
        status:
          $ref: '#/components/schemas/AlertmanagerNotificationStatus'
        receiver:
          type: string
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
          format: uri
          description: Backlink to the Alertmanager
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        subscriber:
          type: object
          description: Optional subscriber information, if a subscriber is found
          properties:
            callbackUrl:
              type: string
              format: uri
              description: URL to call for notifying the subscriber
      required:
      - version
      - groupKey
      - status
      - receiver
      - alerts

    AlarmEventNotification:
      type: object
      description: Alarm Event Notification sent to subscribers
      properties:
        globalCloudId:
          type: string
          format: uuid
          description: The global cloud identifier assigned by the SMO.e
          example: da4698ba-c8a7-429d-ae16-484f15f282c5
        consumerSubscriptionId:
          type: string
          nullable: true
          description: The value provided by the consumer in the subscription.
          example: 3ddc1128-a14d-46de-80da-6414b192ce9f
        notificationEventType:
          type: integer
          enum: [ 0, 1, 2, 3 ]
          x-enum-varnames:
          - NEW
          - CHANGE
          - CLEAR
          - ACKNOWLEDGE
          description: Notification event type values
          example: 0
        objectRef:
          type: string
          nullable: true
          description: |
            A reference to the AlarmEventRecord object. This is emitted as a root-relative
            path (the trailing segment is the alarmEventRecordId). Consumers that require an
            absolute URL must prepend the O-Cloud base URL; the absence of a configurable
            public base URL is a known interoperability limitation.
          example: /O2ims_infrastructureMonitoring/v2/alarms/bf3f8f2e-6f37-4882-96ad-c0b9cef6fc04
        objectClass:
          type: string
          description: |
            The fully qualified name of the class of the object (Resource or NodeCluster) which caused the alarm.
          example: oran.o2ims.cluster.NodeCluster
        alarmEventRecordId:
          type: string
          format: uuid
          description: The URL to the AlarmEventRecord object.
          example: 5f768e89-2ae1-477d-9978-173056154d5d
        objectTypeId:
          type: string
          format: uuid
          description: A reference to the type of resource which caused the alarm.
          example: 91d5d140-ef52-4167-b6dc-975ad1897f23
        objectId:
          type: string
          format: uuid
          description: A reference to the resource instance which caused the alarm.
          example: 3bff173d-a9d5-4157-858f-f934f6fdec45
        alarmDefinitionId:
          type: string
          format: uuid
          description: A reference to the Alarm Definition record in the Alarm Dictionary associated with the referenced ResourceType.
          example: a3a505c7-84dc-4cff-baf8-36f33b3e70fc
        probableCauseId:
          type: string
          format: uuid
          description: A reference to the ProbableCause of the Alarm.
          example: b3cd1cc7-8e5c-42fe-aaf5-59fd94e33a8a
        alarmRaisedTime:
          type: string
          format: date-time
          description: Date/Time stamp value when the AlarmEventRecord has been created.
          example: 2042-07-21T20:32:28Z
        alarmChangedTime:
          type: string
          format: date-time
          nullable: true
          description: Date/Time stamp value when any value of the AlarmEventRecord has been modified.
          example: 2042-07-21T21:32:28Z
        alarmClearedTime:
          type: string
          format: date-time
          nullable: true
          description: Date/Time stamp value when the alarm condition is cleared.
          example: 2042-07-21T20:32:28Z
        alarmAcknowledgeTime:
          type: string
          format: date-time
          nullable: true
          description: Date/Time stamp value when the alarm condition is acknowledged.
          example: 2042-07-21T22:32:28Z
        alarmAcknowledged:
          type: boolean
          description: Boolean value indicating of a management system has acknowledged the alarm.
          example: true
        perceivedSeverity:
          $ref: '#/components/schemas/PerceivedSeverity'
        extensions:
          type: object
          additionalProperties: {}
          description: |
            These are unspecified (not standardized) properties (keys) which are tailored by the vendor or
            operator to extend the information provided about the O-Cloud Alarm.
      required:
      - globalCloudId
      - consumerSubscriptionId
      - notificationEventType
      - objectRef
      - objectClass
      - alarmEventRecordId
      - objectTypeId
      - objectId
      - alarmDefinitionId
      - probableCauseId
      - alarmRaisedTime
      - alarmChangedTime
      - alarmClearedTime
      - alarmAcknowledgeTime
      - alarmAcknowledged
      - perceivedSeverity
      - extensions

    HardwareAlert:
      type: object
      description: Placeholder for hardware alert schema
      # Add properties based on upcoming hardware alert structure
