# Synced with oran-o2ims commit cfec024dff6e61a9e0b92efd464ce5bd4be06f7f
openapi: 3.0.3
info:
  title: O2IMS Infrastructure Monitoring Alarms API
  version: 2.2.0
  description: |
    API for O2IMS Infrastructure Monitoring Alarms.

    All responses served under the versioned /O2ims_infrastructureMonitoring/v2 paths and
    the unversioned /O2ims_infrastructureMonitoring/api_versions discovery endpoint carry a
    `Version: 2.2.0` HTTP response header (on both successful and handled-error responses).
    The header is set by the server's path-scoped middleware; it is not part of any response
    body schema.
  contact:
    name: Red Hat
    url: https://www.redhat.com

externalDocs:
  description: O-RAN O2ims Interface Specification (O-RAN.WG6.TS.O2IMS-INTERFACE-R005-v13.00), available from the O-RAN specifications catalog
  url: https://www.o-ran.org/specifications

servers:
- url: http://localhost:8000
  description: O-RAN Alarms Server

tags:
- name: alarms
  description: Alarm management
- name: serviceConfiguration
  description: Alarm Service Configuration
- name: subscriptions
  description: Alarm subscription management

# Scope enforcement: OAuth scopes are not verified directly from the token's
# scope claim. The OAuth server translates scopes into group memberships
# (via the groups claim), and the Authorizer maps those groups to Kubernetes
