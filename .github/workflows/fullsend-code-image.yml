name: Build Fullsend code image

on:
  push:
    branches:
      - main
    paths:
      - .fullsend/Containerfile
      - .github/workflows/fullsend-code-image.yml

jobs:
  publish:
    if: github.repository == 'rh-ecosystem-edge/eco-gotests' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required to publish this repository's Fullsend image to GHCR.
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .fullsend
          file: .fullsend/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=https://github.com/rh-ecosystem-edge/eco-gotests
          tags: ghcr.io/rh-ecosystem-edge/eco-gotests-fullsend-code:${{ github.sha }}

      - name: Record the image reference for Fullsend
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Fullsend image for the follow-up configuration PR\n\n`ghcr.io/rh-ecosystem-edge/eco-gotests-fullsend-code@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
