# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: codex
roles:
    - triage
    - coder
    - review
    - fix
agents:
    - name: triage
      runtime: codex
      model: openai/gpt-5.6-luna
      effort: medium
    - name: code
      runtime: codex
      model: openai/gpt-5.6-luna
      effort: medium
      harness:
          image: ghcr.io/rh-ecosystem-edge/eco-gotests-fullsend-code@sha256:a5979bab94b60fcbeafe8a5eebcce0555b24c6ddbef665abcb48d3ed9ed3da3e
          skills:
              - skills/eco-gotests-validation
    - name: review
      runtime: codex
      model: openai/gpt-5.6-luna
      effort: medium
      harness:
          skills:
              - skills/eco-gotests-validation
    - name: fix
      runtime: codex
      model: openai/gpt-5.6-luna
      effort: medium
      harness:
          image: ghcr.io/rh-ecosystem-edge/eco-gotests-fullsend-code@sha256:a5979bab94b60fcbeafe8a5eebcce0555b24c6ddbef665abcb48d3ed9ed3da3e
          skills:
              - skills/eco-gotests-validation
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
