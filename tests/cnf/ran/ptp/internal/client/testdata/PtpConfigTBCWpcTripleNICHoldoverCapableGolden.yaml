# Golden: T-BC (01-tbc-tr receiver, index 1) after ChangeHoldoverParameters(180, 7200, 50). Same inert
# JSON quirks as the T-TSC golden fixture.
metadata:
  name: t-bc
  namespace: openshift-ptp
  resourceVersion: "1000"
spec:
  profile:
  - name: 00-tbc-tt
    ptp4lConf: |
      [ens4f0]
      masterOnly 1
      [ens8f0]
      masterOnly 1
      [ens1f0]
      masterOnly 1
      [global]
      twoStepFlag 1
      slaveOnly 0
      priority1 128
      priority2 128
      domainNumber 25
      clockClass 248
      clockAccuracy 0xFE
      offsetScaledLogVariance 0xFFFF
      clock_type BC
      network_transport L2
      delay_mechanism E2E
      time_stamping hardware
    ptp4lOpts: -2 --summary_interval -4
    ptpSchedulingPolicy: SCHED_FIFO
    ptpSchedulingPriority: 10
    ptpSettings:
      controllingProfile: 01-tbc-tr
      logReduce: "false"
  - name: 01-tbc-tr
    phc2sysOpts: -r -n 25 -N 8 -R 16 -u 0 -m -s ens4f1
    plugins:
      e810:
        interconnections:
        - Part: E810-XXVDA4T
          gnssInput: false
          id: ens4f0
          phaseOutputConnectors:
          - SMA1
          - SMA2
          upstreamPort: ens4f1
        - Part: E810-XXVDA4T
          gnssInput: false
          id: ens1f0
          inputConnector:
            connector: SMA1
            delayPs: 0
          phaseOutputConnectors: null
          upstreamPort: ""
        - Part: E810-XXVDA4T
          gnssInput: false
          id: ens8f0
          inputConnector:
            connector: SMA1
            delayPs: 0
          phaseOutputConnectors: null
          upstreamPort: ""
        pins:
          ens1f0:
            SMA1: 1 1
            SMA2: 0 2
            U.FL1: 0 1
            U.FL2: 0 2
          ens4f0:
            SMA1: 2 1
            SMA2: 2 2
            U.FL1: 0 1
            U.FL2: 0 2
          ens8f0:
            SMA1: 1 1
            SMA2: 0 2
            U.FL1: 0 1
            U.FL2: 0 2
        settings:
          LocalHoldoverTimeout: 180
          LocalMaxHoldoverOffSet: 7200
          MaxInSpecOffset: 50
    ptp4lConf: |
      [ens4f1]
      masterOnly 0
      [global]
      twoStepFlag 1
      slaveOnly 0
      priority1 128
      priority2 128
      domainNumber 25
      clockClass 248
      clockAccuracy 0xFE
      offsetScaledLogVariance 0xFFFF
      clock_type OC
      network_transport L2
      delay_mechanism E2E
      time_stamping hardware
    ptp4lOpts: -2 --summary_interval -4
    ptpSchedulingPolicy: SCHED_FIFO
    ptpSchedulingPriority: 10
    ptpSettings:
      inSyncConditionThreshold: "10"
      inSyncConditionTimes: "12"
      logReduce: "false"
    ts2phcConf: |
      [global]
      use_syslog  0
      verbose 1
      logging_level 7
      ts2phc.pulsewidth 100000000
      leapfile  /usr/share/zoneinfo/leap-seconds.list
      domainNumber 25
      uds_address /var/run/ptp4l.0.socket
      [ens4f0]
      ts2phc.extts_polarity rising
      ts2phc.extts_correction -10
      ts2phc.master 0
      [ens1f0]
      ts2phc.extts_polarity rising
      ts2phc.extts_correction -27
      ts2phc.master 0
      [ens8f0]
      ts2phc.extts_polarity rising
      ts2phc.extts_correction -27
      ts2phc.master 0
    ts2phcOpts: -s generic -a --ts2phc.rh_external_pps 1
  recommend:
  - match:
    - nodeLabel: node-role.kubernetes.io/master
    priority: 4
    profile: 00-tbc-tt
  - match:
    - nodeLabel: node-role.kubernetes.io/master
    priority: 4
    profile: 01-tbc-tr
status: {}
